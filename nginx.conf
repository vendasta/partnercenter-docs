server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;


    # Prevent absolute redirects from including :8080
    absolute_redirect off;
    port_in_redirect off;

    # Strip /docs prefix
    location ~ ^/docs(/.*)$ {
        return 302 $1;
    }

    # Learn restructure (2026-07): case-only renames handled server-side
    location = /learn/vendasta-services/Fulfilling-Websites-with-Marketing-Services {
        return 301 /learn/vendasta-services/fulfilling-websites-with-marketing-services;
    }
    location = /learn/vendasta-services/Introduction-to-Digital-Ads {
        return 301 /learn/vendasta-services/introduction-to-digital-ads;
    }

    # Redirect Business App category to root page
    location ~ ^/category/business-app/?$ {
        return 301 /business-app/;
    }

    # /docs -> /
    location = /docs {
        return 302 /;
    }

    # Main handler - serve files or fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets (js, css, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /vendasta-services/working-with-our-team/vendasta-services-training-webinars-for-partners {
        return 301 https://www.vendasta.com/webinar;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
