server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;


    # Prevent absolute redirects from including :8080
    absolute_redirect off;
    port_in_redirect off;

    # Strip the old /docs prefix. Permanent, and straight to the slash form
    # every page is served at, so a legacy link lands in one hop.
    location = /docs {
        return 301 /;
    }
    location = /docs/ {
        return 301 /;
    }
    location ~ ^/docs/(.*?)/?$ {
        return 301 /$1/;
    }

    # Learn restructure (2026-07): case-only renames handled server-side.
    # The lower-case Learn pages were archived in 2026-10, so point straight
    # at where their content lives now (see the client redirects in
    # docusaurus.config.ts) instead of chaining through another redirect.
    location = /learn/vendasta-services/Fulfilling-Websites-with-Marketing-Services {
        return 301 /vendasta-services/using-the-platform/;
    }
    location = /learn/vendasta-services/Introduction-to-Digital-Ads {
        return 301 /vendasta-services/working-with-our-team/;
    }

    # Redirect Business App category to root page
    location ~ ^/category/business-app/?$ {
        return 301 /business-app/;
    }

    # Pages. Docusaurus builds every route as <route>/index.html, so an
    # address with nothing behind it is a real 404, not the homepage.
    # No add_header here: one in a location would discard the server-level
    # security headers, and `expires` already sets Cache-Control.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        expires 1h;
    }

    # Static assets (js, css, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map)$ {
        expires 30d;
    }

    error_page 404 /404.html;

    location = /vendasta-services/working-with-our-team/vendasta-services-training-webinars-for-partners {
        return 301 https://www.vendasta.com/webinar;
    }

    # Security headers; `always` keeps them on 404s and other error responses.
    # TLS ends at Cloud Run, so HSTS is set here; browsers ignore it over
    # plain HTTP. No X-XSS-Protection: browsers retired it.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
