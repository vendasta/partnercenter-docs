<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Open Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F9B63"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976D2"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Title row -->
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#072337">The Vendasta ecosystem: two workspaces, one system</text>

  <!-- Partner Center box -->
  <rect x="40" y="60" width="400" height="330" rx="12" fill="#f5f9f7" stroke="#3F9B63" stroke-width="2"/>
  <text x="240" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#072337">PARTNER CENTER</text>
  <text x="240" y="116" text-anchor="middle" font-size="13" fill="#555555">Your command center (partners.vendasta.com)</text>
  <line x1="70" y1="130" x2="410" y2="130" stroke="#E0E0E0" stroke-width="1"/>

  <text x="70" y="158" font-size="13.5" fill="#333333">Accounts: activate products, billing</text>
  <text x="70" y="184" font-size="13.5" fill="#333333">CRM: contacts, companies, pipelines, My Meetings</text>
  <text x="70" y="210" font-size="13.5" fill="#333333">Marketplace: products, packages, your store</text>
  <text x="70" y="236" font-size="13.5" fill="#333333">Automations: triggers and workflows</text>
  <text x="70" y="262" font-size="13.5" fill="#333333">Administration: team, branding, payments</text>

  <rect x="60" y="284" width="360" height="84" rx="8" fill="#eaf4ee" stroke="#3F9B63" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="240" y="309" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E7655">YOUR AI employees work here</text>
  <text x="240" y="331" text-anchor="middle" font-size="12.5" fill="#555555">The receptionist on YOUR website, your sales</text>
  <text x="240" y="349" text-anchor="middle" font-size="12.5" fill="#555555">assistant, your capabilities and knowledge</text>

  <!-- Business App box -->
  <rect x="520" y="60" width="400" height="330" rx="12" fill="#f4f8fc" stroke="#1976D2" stroke-width="2"/>
  <text x="720" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#072337">BUSINESS APP</text>
  <text x="720" y="116" text-anchor="middle" font-size="13" fill="#555555">Your client's workspace, under your brand</text>
  <line x1="550" y1="130" x2="890" y2="130" stroke="#E0E0E0" stroke-width="1"/>

  <text x="550" y="158" font-size="13.5" fill="#333333">Their dashboard: products they bought from you</text>
  <text x="550" y="184" font-size="13.5" fill="#333333">Inbox: conversations, web chat, SMS</text>
  <text x="550" y="210" font-size="13.5" fill="#333333">Their CRM, forms, and campaigns</text>
  <text x="550" y="236" font-size="13.5" fill="#333333">Executive Report: proof of performance</text>
  <text x="550" y="262" font-size="13.5" fill="#333333">Vibe: apps built on their business data</text>

  <rect x="540" y="284" width="360" height="84" rx="8" fill="#e9f1fa" stroke="#1976D2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="720" y="309" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1976D2">Your CLIENT'S AI employees work here</text>
  <text x="720" y="331" text-anchor="middle" font-size="12.5" fill="#555555">The receptionist on THEIR website, their voice line,</text>
  <text x="720" y="349" text-anchor="middle" font-size="12.5" fill="#555555">their reputation specialist and knowledge</text>

  <!-- Flows between boxes -->
  <line x1="440" y1="170" x2="520" y2="170" stroke="#3F9B63" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="480" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7655">You activate</text>

  <line x1="520" y1="250" x2="440" y2="250" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="480" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#1976D2">Leads and proof</text>

  <!-- One-way street strip -->
  <rect x="40" y="420" width="880" height="110" rx="12" fill="#fafafa" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="480" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#072337">The one-way street</text>

  <rect x="150" y="468" width="230" height="44" rx="8" fill="#f5f9f7" stroke="#3F9B63" stroke-width="1.5"/>
  <text x="265" y="495" text-anchor="middle" font-size="13.5" font-weight="600" fill="#072337">Create an ACCOUNT</text>

  <line x1="380" y1="490" x2="570" y2="490" stroke="#8a8a8a" stroke-width="2.5" marker-end="url(#arrowGrey)"/>
  <text x="475" y="481" text-anchor="middle" font-size="12" fill="#555555">automatically creates</text>

  <rect x="580" y="468" width="230" height="44" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="695" y="495" text-anchor="middle" font-size="13.5" font-weight="600" fill="#072337">a CRM COMPANY</text>

  <text x="480" y="546" text-anchor="middle" font-size="12" fill="#8a2b2b">A CRM company does NOT create an account. Accounts are for products and billing; the CRM is for activity.</text>
</svg>
