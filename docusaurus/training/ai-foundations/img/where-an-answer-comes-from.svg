<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Left panel: left to guess -->
  <rect x="16" y="16" width="322" height="258" rx="10" fill="#f5f7f9"/>
  <text x="177" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#072337">Left to guess</text>

  <rect x="48" y="68" width="258" height="44" rx="8" fill="#ffffff" stroke="#c9d4db"/>
  <text x="177" y="95" text-anchor="middle" font-size="13" fill="#072337">A customer question</text>

  <line x1="177" y1="112" x2="177" y2="130" stroke="#c9d4db" stroke-width="2"/>

  <rect x="48" y="130" width="258" height="44" rx="8" fill="#ffffff" stroke="#c9d4db"/>
  <text x="177" y="157" text-anchor="middle" font-size="13" fill="#072337">The model&#8217;s general patterns</text>

  <line x1="177" y1="174" x2="177" y2="192" stroke="#c9d4db" stroke-width="2"/>

  <rect x="48" y="192" width="258" height="44" rx="8" fill="#ffffff" stroke="#c9d4db" stroke-dasharray="5 4"/>
  <text x="177" y="219" text-anchor="middle" font-size="13" font-style="italic" fill="#5b6b78">A plausible guess</text>

  <!-- Right panel: given the facts -->
  <rect x="362" y="16" width="322" height="258" rx="10" fill="#e9f1fa"/>
  <text x="523" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#072337">Given the facts</text>

  <rect x="394" y="68" width="258" height="44" rx="8" fill="#ffffff" stroke="#a9c4e0"/>
  <text x="523" y="95" text-anchor="middle" font-size="13" fill="#072337">A customer question</text>

  <line x1="523" y1="112" x2="523" y2="130" stroke="#a9c4e0" stroke-width="2"/>

  <rect x="394" y="130" width="124" height="44" rx="8" fill="#ffffff" stroke="#a9c4e0"/>
  <text x="456" y="151" text-anchor="middle" font-size="12.5" fill="#072337">Your business</text>
  <text x="456" y="166" text-anchor="middle" font-size="12.5" fill="#072337">facts</text>

  <text x="523" y="157" text-anchor="middle" font-size="14" font-weight="600" fill="#5b6b78">+</text>

  <rect x="528" y="130" width="124" height="44" rx="8" fill="#ffffff" stroke="#a9c4e0"/>
  <text x="590" y="157" text-anchor="middle" font-size="12.5" fill="#072337">The model</text>

  <line x1="523" y1="174" x2="523" y2="192" stroke="#a9c4e0" stroke-width="2"/>

  <rect x="394" y="192" width="258" height="44" rx="8" fill="#3F9B63"/>
  <text x="523" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">An answer built from</text>
  <text x="523" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">your facts</text>
</svg>
