<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Conversation chip -->
  <rect x="240" y="8" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d4db"/>
  <text x="350" y="32" text-anchor="middle" font-size="13" fill="#072337">The live conversation</text>

  <line x1="350" y1="46" x2="350" y2="76" stroke="#c9d4db" stroke-width="2"/>
  <text x="360" y="66" font-size="11.5" fill="#5b6b78">Triggers</text>

  <!-- Employee card -->
  <rect x="40" y="76" width="620" height="238" rx="12" fill="#072337"/>
  <text x="350" y="110" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">An AI Employee</text>

  <!-- Role compartment -->
  <rect x="64" y="132" width="184" height="156" rx="10" fill="#e9f1fa"/>
  <text x="156" y="164" text-anchor="middle" font-size="14.5" font-weight="600" fill="#072337">Role</text>
  <text x="156" y="192" text-anchor="middle" font-size="12.5" fill="#334755">who it is</text>
  <text x="156" y="226" text-anchor="middle" font-size="11.5" fill="#5b6b78">tone and guidelines,</text>
  <text x="156" y="243" text-anchor="middle" font-size="11.5" fill="#5b6b78">in every reply</text>

  <!-- Knowledge compartment -->
  <rect x="258" y="132" width="184" height="156" rx="10" fill="#e9f1fa"/>
  <text x="350" y="164" text-anchor="middle" font-size="14.5" font-weight="600" fill="#072337">Knowledge</text>
  <text x="350" y="192" text-anchor="middle" font-size="12.5" fill="#334755">what it knows</text>
  <text x="350" y="226" text-anchor="middle" font-size="11.5" fill="#5b6b78">profile, website,</text>
  <text x="350" y="243" text-anchor="middle" font-size="11.5" fill="#5b6b78">documents, entries</text>

  <!-- Capabilities compartment, with Tools nested inside it -->
  <rect x="452" y="132" width="184" height="156" rx="10" fill="#e9f1fa"/>
  <text x="544" y="160" text-anchor="middle" font-size="14.5" font-weight="600" fill="#072337">Capabilities</text>
  <text x="544" y="184" text-anchor="middle" font-size="12.5" fill="#334755">what it does</text>

  <rect x="468" y="202" width="152" height="70" rx="8" fill="#ffffff" stroke="#c9d4db"/>
  <text x="544" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#072337">Tools</text>
  <text x="544" y="244" text-anchor="middle" font-size="10.5" fill="#5b6b78">doorways into</text>
  <text x="544" y="259" text-anchor="middle" font-size="10.5" fill="#5b6b78">other systems</text>
</svg>
