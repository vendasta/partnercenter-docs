<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Conversation chip -->
  <rect x="240" y="14" width="220" height="40" rx="20" fill="#ffffff" stroke="#c9d4db"/>
  <text x="350" y="39" text-anchor="middle" font-size="13" fill="#072337">The live conversation</text>

  <line x1="350" y1="54" x2="350" y2="76" stroke="#c9d4db" stroke-width="2"/>

  <!-- Employee card -->
  <rect x="40" y="76" width="620" height="238" rx="12" fill="#072337"/>
  <text x="350" y="110" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">An AI Employee</text>

  <!-- Knowledge compartment -->
  <rect x="64" y="132" width="184" height="156" rx="10" fill="#e9f1fa"/>
  <text x="156" y="164" text-anchor="middle" font-size="14.5" font-weight="600" fill="#072337">Knowledge</text>
  <text x="156" y="192" text-anchor="middle" font-size="12.5" fill="#334755">what it knows</text>
  <text x="156" y="226" text-anchor="middle" font-size="11.5" fill="#5b6b78">profile, website,</text>
  <text x="156" y="243" text-anchor="middle" font-size="11.5" fill="#5b6b78">documents, entries</text>

  <!-- Capabilities compartment -->
  <rect x="258" y="132" width="184" height="156" rx="10" fill="#e9f1fa"/>
  <text x="350" y="164" text-anchor="middle" font-size="14.5" font-weight="600" fill="#072337">Capabilities</text>
  <text x="350" y="192" text-anchor="middle" font-size="12.5" fill="#334755">what it does</text>
  <text x="350" y="226" text-anchor="middle" font-size="11.5" fill="#5b6b78">instructions for</text>
  <text x="350" y="243" text-anchor="middle" font-size="11.5" fill="#5b6b78">each skill</text>

  <!-- Tools compartment -->
  <rect x="452" y="132" width="184" height="156" rx="10" fill="#e9f1fa"/>
  <text x="544" y="164" text-anchor="middle" font-size="14.5" font-weight="600" fill="#072337">Tools</text>
  <text x="544" y="192" text-anchor="middle" font-size="12.5" fill="#334755">how it acts</text>
  <text x="544" y="226" text-anchor="middle" font-size="11.5" fill="#5b6b78">doorways into</text>
  <text x="544" y="243" text-anchor="middle" font-size="11.5" fill="#5b6b78">other systems</text>
</svg>
