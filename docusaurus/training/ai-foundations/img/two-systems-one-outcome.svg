<svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Step 1: trigger -->
  <rect x="14" y="60" width="148" height="90" rx="10" fill="#f5f7f9" stroke="#c9d4db"/>
  <text x="88" y="98" text-anchor="middle" font-size="13" fill="#072337">A job wraps up</text>
  <text x="88" y="118" text-anchor="middle" font-size="11.5" fill="#5b6b78">the trigger</text>

  <path d="M 168 105 l 14 -7 v 14 z" fill="#c9d4db"/>

  <!-- Step 2: automation -->
  <rect x="188" y="60" width="148" height="90" rx="10" fill="#3F9B63"/>
  <text x="262" y="42" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1" fill="#3F9B63">AUTOMATION</text>
  <text x="262" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Sends the review</text>
  <text x="262" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">request</text>
  <text x="262" y="132" text-anchor="middle" font-size="11.5" fill="#d8ecdf">same steps, every time</text>

  <path d="M 342 105 l 14 -7 v 14 z" fill="#c9d4db"/>

  <!-- Step 3: event -->
  <rect x="362" y="60" width="148" height="90" rx="10" fill="#f5f7f9" stroke="#c9d4db"/>
  <text x="436" y="98" text-anchor="middle" font-size="13" fill="#072337">A review comes in</text>
  <text x="436" y="118" text-anchor="middle" font-size="11.5" fill="#5b6b78">five stars, or not</text>

  <path d="M 516 105 l 14 -7 v 14 z" fill="#c9d4db"/>

  <!-- Step 4: AI Employee -->
  <rect x="536" y="60" width="148" height="90" rx="10" fill="#1976D2"/>
  <text x="610" y="42" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1" fill="#1976D2">AI EMPLOYEE</text>
  <text x="610" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Writes a response</text>
  <text x="610" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">that fits it</text>
  <text x="610" y="132" text-anchor="middle" font-size="11.5" fill="#d6e6f7">judgment, every time</text>
</svg>
