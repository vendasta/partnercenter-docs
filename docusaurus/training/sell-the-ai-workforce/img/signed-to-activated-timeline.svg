<svg viewBox="0 0 880 190" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Timeline from a signed client to an activated client: signed on day zero, live and tested within seven days, first lead captured within fourteen days, and the proof point saved for the next sale.">
  <!-- baseline -->
  <line x1="60" y1="95" x2="820" y2="95" stroke="#072337" stroke-width="2"/>

  <!-- milestone 1: Signed -->
  <circle cx="90" cy="95" r="11" fill="#072337"/>
  <text x="90" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#072337">Signed</text>
  <text x="90" y="130" text-anchor="middle" font-size="13" fill="#5a6b76">Day 0</text>
  <text x="90" y="150" text-anchor="middle" font-size="13" fill="#5a6b76">Intake form sent</text>

  <!-- milestone 2: Live and tested -->
  <circle cx="330" cy="95" r="11" fill="#1976D2"/>
  <text x="330" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#072337">Live and tested</text>
  <text x="330" y="130" text-anchor="middle" font-size="13" fill="#5a6b76">By day 7</text>
  <text x="330" y="150" text-anchor="middle" font-size="13" fill="#5a6b76">Every component tested</text>

  <!-- milestone 3: First lead -->
  <circle cx="570" cy="95" r="11" fill="#1976D2"/>
  <text x="570" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#072337">First lead captured</text>
  <text x="570" y="130" text-anchor="middle" font-size="13" fill="#5a6b76">By day 14</text>
  <text x="570" y="150" text-anchor="middle" font-size="13" fill="#5a6b76">Client sees the value</text>

  <!-- milestone 4: Proof point -->
  <circle cx="790" cy="95" r="11" fill="#3F9B63"/>
  <text x="790" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#3F9B63">Proof point saved</text>
  <text x="790" y="130" text-anchor="middle" font-size="13" fill="#5a6b76">One line, one result</text>
  <text x="790" y="150" text-anchor="middle" font-size="13" fill="#5a6b76">Fuels the next sale</text>
</svg>
