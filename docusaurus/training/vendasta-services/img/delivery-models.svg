<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 0 806 284" width="806" height="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Three delivery models compared by who configures the work, who runs it afterward, and what you pay</title>

  <!-- Column headers -->
  <rect x="140" y="14" width="195" height="42" rx="8" fill="#1976D2"/>
  <text x="237.5" y="41" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Do it yourself</text>

  <rect x="350" y="14" width="195" height="42" rx="8" fill="#3F9B63"/>
  <text x="447.5" y="41" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Do it with you</text>

  <rect x="560" y="14" width="195" height="42" rx="8" fill="#072337"/>
  <text x="657.5" y="41" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Do it for you</text>

  <!-- Row 1 -->
  <text x="128" y="103" text-anchor="end" font-size="12" font-weight="700" fill="#072337" letter-spacing="0.4">WHO CONFIGURES</text>
  <rect x="140" y="66" width="195" height="62" rx="8" fill="#e9f1fa" stroke="#c8dcf0"/>
  <text x="237.5" y="94" text-anchor="middle" font-size="13" fill="#072337">You, in the</text>
  <text x="237.5" y="112" text-anchor="middle" font-size="13" fill="#072337">platform</text>

  <rect x="350" y="66" width="195" height="62" rx="8" fill="#e9f1fa" stroke="#c8dcf0"/>
  <text x="447.5" y="94" text-anchor="middle" font-size="13" fill="#072337">The team, with you</text>
  <text x="447.5" y="112" text-anchor="middle" font-size="13" fill="#072337">on onboarding calls</text>

  <rect x="560" y="66" width="195" height="62" rx="8" fill="#e9f1fa" stroke="#c8dcf0"/>
  <text x="657.5" y="103" text-anchor="middle" font-size="13" fill="#072337">The team</text>

  <!-- Row 2 -->
  <text x="128" y="173" text-anchor="end" font-size="12" font-weight="700" fill="#072337" letter-spacing="0.4">WHO RUNS IT AFTER</text>
  <rect x="140" y="136" width="195" height="62" rx="8" fill="#f4f7fa" stroke="#dde5ec"/>
  <text x="237.5" y="173" text-anchor="middle" font-size="13" fill="#072337">You</text>

  <rect x="350" y="136" width="195" height="62" rx="8" fill="#f4f7fa" stroke="#dde5ec"/>
  <text x="447.5" y="173" text-anchor="middle" font-size="13" fill="#072337">You</text>

  <rect x="560" y="136" width="195" height="62" rx="8" fill="#f4f7fa" stroke="#dde5ec"/>
  <text x="657.5" y="173" text-anchor="middle" font-size="13" fill="#072337">The team</text>

  <!-- Row 3 -->
  <text x="128" y="243" text-anchor="end" font-size="12" font-weight="700" fill="#072337" letter-spacing="0.4">WHAT YOU PAY</text>
  <rect x="140" y="206" width="195" height="62" rx="8" fill="#e9f1fa" stroke="#c8dcf0"/>
  <text x="237.5" y="234" text-anchor="middle" font-size="13" fill="#072337">Product</text>
  <text x="237.5" y="252" text-anchor="middle" font-size="13" fill="#072337">subscription</text>

  <rect x="350" y="206" width="195" height="62" rx="8" fill="#e9f1fa" stroke="#c8dcf0"/>
  <text x="447.5" y="234" text-anchor="middle" font-size="13" fill="#072337">One-time</text>
  <text x="447.5" y="252" text-anchor="middle" font-size="13" fill="#072337">setup fee</text>

  <rect x="560" y="206" width="195" height="62" rx="8" fill="#e9f1fa" stroke="#c8dcf0"/>
  <text x="657.5" y="234" text-anchor="middle" font-size="13" fill="#072337">Monthly</text>
  <text x="657.5" y="252" text-anchor="middle" font-size="13" fill="#072337">service fee</text>
</svg>
