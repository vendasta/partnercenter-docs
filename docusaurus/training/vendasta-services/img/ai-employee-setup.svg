<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 176" width="790" height="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The four stages of an AI employee setup engagement: initial training call, configuration, walkthrough call, and 30-day check-in, with the timing of each</title>

  <!-- Stage 1 -->
  <rect x="16" y="16" width="165" height="62" rx="8" fill="#788691"/>
  <text x="98.5" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Initial training</text>
  <text x="98.5" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">call</text>
  <text x="98.5" y="104" text-anchor="middle" font-size="12" fill="#072337">Bookable in as little</text>
  <text x="98.5" y="121" text-anchor="middle" font-size="12" fill="#072337">as 1 business day</text>

  <text x="203.5" y="53" text-anchor="middle" font-size="20" fill="#788691">&#8594;</text>

  <!-- Stage 2 -->
  <rect x="226" y="16" width="165" height="62" rx="8" fill="#556773"/>
  <text x="308.5" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Configuration</text>
  <text x="308.5" y="104" text-anchor="middle" font-size="12" fill="#072337">1 business day, or 3</text>
  <text x="308.5" y="121" text-anchor="middle" font-size="12" fill="#072337">with custom work</text>

  <text x="413.5" y="53" text-anchor="middle" font-size="20" fill="#788691">&#8594;</text>

  <!-- Stage 3 -->
  <rect x="436" y="16" width="165" height="62" rx="8" fill="#2E4655"/>
  <text x="518.5" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Walkthrough</text>
  <text x="518.5" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">call</text>
  <text x="518.5" y="104" text-anchor="middle" font-size="12" fill="#072337">1 business day after</text>
  <text x="518.5" y="121" text-anchor="middle" font-size="12" fill="#072337">setup completes</text>

  <text x="623.5" y="53" text-anchor="middle" font-size="20" fill="#788691">&#8594;</text>

  <!-- Stage 4 -->
  <rect x="646" y="16" width="128" height="62" rx="8" fill="#071C2A"/>
  <text x="710" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">30-day</text>
  <text x="710" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">check-in</text>
  <text x="710" y="104" text-anchor="middle" font-size="12" fill="#072337">3 to 4 weeks</text>
  <text x="710" y="121" text-anchor="middle" font-size="12" fill="#072337">after launch</text>

  <!-- Live marker -->
  <rect x="436" y="141" width="338" height="26" rx="6" fill="#e6f3ec" stroke="#3F9B63"/>
  <text x="605" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#1f6b41">Your AI employee is live and taking work from here</text>
</svg>
