steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/repcore-prod/docs-repo/partnercenter-docs:$COMMIT_SHA', '.']

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/repcore-prod/docs-repo/partnercenter-docs:$COMMIT_SHA']

  # Deploy container image to Cloud Run. Retried because Cloud Run
  # occasionally fails a good image with "Container import failed"; a fresh
  # attempt on the same image succeeds. $$ escapes shell vars from Cloud
  # Build substitution.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        for attempt in 1 2 3; do
          gcloud run deploy partnercenter-docs \
            --image us-central1-docker.pkg.dev/repcore-prod/docs-repo/partnercenter-docs:$COMMIT_SHA \
            --region us-central1 \
            --platform managed && exit 0
          echo "Deploy attempt $$attempt failed; retrying in 30s"
          sleep 30
        done
        exit 1

  # Also tag as latest for convenience
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 
           'us-central1-docker.pkg.dev/repcore-prod/docs-repo/partnercenter-docs:$COMMIT_SHA', 
           'us-central1-docker.pkg.dev/repcore-prod/docs-repo/partnercenter-docs:latest']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/repcore-prod/docs-repo/partnercenter-docs:latest']

# Store images in Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/repcore-prod/docs-repo/partnercenter-docs:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/repcore-prod/docs-repo/partnercenter-docs:latest'

# Use a bigger machine so the docusaurus build (multiple locales' worth of
# content) isn't CPU-bound on the default E2_MEDIUM (1 vCPU)
options:
  machineType: 'E2_HIGHCPU_8'
  # Non-default machine types aren't supported with the legacy logging mode
  logging: 'CLOUD_LOGGING_ONLY'

# Set a longer timeout for the build
timeout: '3600s'
