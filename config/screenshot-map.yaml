# Screenshot Map
# Maps Getting Started guide sections to Partner Center URLs and image filenames.
# Each entry produces one screenshot. Add or remove entries to control scope.
# All paths are relative to the repo root.

base_url: "https://partners.vendasta.com"
viewport:
  width: 1440
  height: 900

guides:

  # ─────────────────────────────────────────────
  # Branding and Customization Guide
  # ─────────────────────────────────────────────
  - file: "docusaurus/docs/getting-started/getting-started-guides/getting-started-with-branding-and-customization.mdx"
    img_dir: "docusaurus/docs/getting-started/getting-started-guides/img"
    sections:

      # Step 1: Set Up Partner Branding
      - header: "### Company Name"
        url: "/customize-branding"
        screenshot_name: "partner-branding-company-name.png"
        alt: "Company Name field on the Partner Branding page"
        focus_element: "Company Name field"

      - header: "### Logo"
        url: "/customize-branding"
        screenshot_name: "partner-branding-logo.png"
        alt: "Logo upload section showing light mode and dark mode options"
        focus_element: "Logo upload area"

      - header: "### Primary Color"
        url: "/customize-branding"
        screenshot_name: "partner-branding-primary-color.png"
        alt: "Primary Color hex field and color picker"
        focus_element: "Primary Color section"

      - header: "### Theme"
        url: "/customize-branding"
        screenshot_name: "partner-branding-theme.png"
        alt: "Theme selector with Light and Dark options"
        focus_element: "Theme section"

      - header: "### Favicon"
        url: "/customize-branding"
        screenshot_name: "partner-branding-favicon.png"
        alt: "Favicon upload section on the Partner Branding page"
        focus_element: "Favicon upload area"

      - header: "### Company Avatar / Shortcut Icon"
        url: "/customize-branding"
        screenshot_name: "partner-branding-avatar.png"
        alt: "Company Avatar upload section for mobile shortcut icon"
        focus_element: "Company Avatar section"

      # Step 2: Customize Business App
      - header: "### Rename Business App"
        url: "/manage-business-app/customize"
        screenshot_name: "customize-ba-rename.png"
        alt: "Rename Business App field in Customize Business App settings"
        focus_element: "Rename Business App field"

      - header: "### Add a Custom Domain"
        url: "/manage-business-app/customize"
        screenshot_name: "customize-ba-custom-domain.png"
        alt: "Custom domain configuration section"
        focus_element: "Custom domain section"

      - header: "### Web Chat Footer Branding"
        url: "/manage-business-app/customize"
        screenshot_name: "customize-ba-web-chat-footer.png"
        alt: "Conversations Web Chat footer branding toggle"
        focus_element: "Web Chat footer toggle"

      # Step 3: Control what clients see
      - header: "### Recommended starting point"
        url: "/manage-business-app/customize"
        screenshot_name: "page-visibility-overview.png"
        alt: "Page visibility settings showing available pages in the sidebar"
        focus_element: "Page list sidebar"
        notes: "Navigate to the Pages tab before capturing"

      - header: "### How to show or hide a page"
        url: "/manage-business-app/customize"
        screenshot_name: "page-visibility-toggle.png"
        alt: "Show this page toggle for a selected page"
        focus_element: "Show this page toggle"
        notes: "Select a page from the sidebar first, then capture the toggle"

      # Step 4: Market-Specific Branding (no subsections)
      - header: "## Step 4"
        url: "/customize-branding"
        screenshot_name: "market-specific-branding.png"
        alt: "All Markets dropdown selector on the Partner Branding page"
        focus_element: "All Markets dropdown"
        notes: "Click the All Markets dropdown to show the market list"

  # ─────────────────────────────────────────────
  # Your Team Guide
  # ─────────────────────────────────────────────
  - file: "docusaurus/docs/getting-started/getting-started-guides/getting-started-with-your-team.mdx"
    img_dir: "docusaurus/docs/getting-started/getting-started-guides/img"
    sections:

      # Step 1: Understand the roles (no subsections)
      - header: "## Step 1: Understand the roles"
        url: "/my-team"
        screenshot_name: "my-team-overview.png"
        alt: "My Team page showing team members with their roles"
        focus_element: "Team members list"

      # Step 2: Invite your team members
      - header: "### Invite an admin"
        url: "/my-team"
        screenshot_name: "invite-admin.png"
        alt: "Invite team member form with admin role selected"
        focus_element: "Invite team member dialog"
        notes: "Click Invite team member button first to open the dialog"

      - header: "### Invite a salesperson"
        url: "/my-team"
        screenshot_name: "invite-salesperson.png"
        alt: "Invite team member form with Salesperson role selected"
        focus_element: "Invite team member dialog with Salesperson selected"
        notes: "Open invite dialog and select Salesperson role"

      - header: "### Invite a digital agent"
        url: "/my-team"
        screenshot_name: "invite-digital-agent.png"
        alt: "Invite team member form with Digital Agent role selected"
        focus_element: "Invite team member dialog with Digital Agent selected"
        notes: "Open invite dialog and select Digital Agent role"

      # Step 3: Set permissions
      - header: "### Key admin permissions"
        url: "/my-team"
        screenshot_name: "admin-permissions.png"
        alt: "Admin permissions panel showing toggles for each permission"
        focus_element: "Permissions toggles"
        notes: "Click Edit member on an admin, then expand Show more permissions"

      - header: "### Key salesperson permissions"
        url: "/my-team"
        screenshot_name: "salesperson-permissions.png"
        alt: "Salesperson permissions panel showing access toggles"
        focus_element: "Salesperson permissions section"
        notes: "Click Edit member on a salesperson to show permissions"

      # Step 4: Manage your team
      - header: "### Edit a team member"
        url: "/my-team"
        screenshot_name: "edit-team-member.png"
        alt: "Edit member dialog showing name, email, and role fields"
        focus_element: "Edit member dialog"
        notes: "Click the menu icon next to a team member, then Edit member"

      - header: "### Reset a team member's password"
        url: "/my-team"
        screenshot_name: "resend-welcome-email.png"
        alt: "Team member menu showing the Resend welcome email option"
        focus_element: "Context menu with Resend welcome email"
        notes: "Click the menu icon next to a team member"

      - header: "### Delete a team member"
        url: "/my-team"
        screenshot_name: "delete-team-member.png"
        alt: "Delete member confirmation dialog"
        focus_element: "Delete confirmation dialog"
        notes: "Click the menu icon, then Delete member to show confirmation"
