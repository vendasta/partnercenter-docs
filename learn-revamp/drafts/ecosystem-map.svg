<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 960 360" font-family="'Open Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="960" height="405" fill="#ffffff"/>

  <!-- Partner Center box -->
  <rect x="40" y="60" width="400" height="330" rx="12" fill="#f5f9f7" stroke="#3F9B63" stroke-width="2"/>
  <text x="240" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#072337">PARTNER CENTER</text>
  <text x="240" y="116" text-anchor="middle" font-size="13" fill="#555555">Your command center (partners.vendasta.com)</text>
  <line x1="70" y1="130" x2="410" y2="130" stroke="#E0E0E0" stroke-width="1"/>

  <text x="70" y="158" font-size="13.5" fill="#333333">Accounts: activate products, billing</text>
  <text x="70" y="184" font-size="13.5" fill="#333333">CRM: contacts, companies, pipelines, My Meetings</text>
  <text x="70" y="210" font-size="13.5" fill="#333333">Marketplace: products, packages, your store</text>
  <text x="70" y="236" font-size="13.5" fill="#333333">Automations: triggers and workflows</text>
  <text x="70" y="262" font-size="13.5" fill="#333333">Administration: team, branding, payments</text>

  <rect x="60" y="284" width="360" height="84" rx="8" fill="#eaf4ee" stroke="#3F9B63" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="240" y="309" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E7655">YOUR AI employees work here</text>
  <text x="240" y="331" text-anchor="middle" font-size="12.5" fill="#555555">Your receptionist and sales assistant, your</text>
  <text x="240" y="349" text-anchor="middle" font-size="12.5" fill="#555555">capabilities and your knowledge</text>

  <!-- Business App box -->
  <rect x="520" y="60" width="400" height="330" rx="12" fill="#f4f8fc" stroke="#1976D2" stroke-width="2"/>
  <text x="720" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#072337">BUSINESS APP</text>
  <text x="720" y="116" text-anchor="middle" font-size="13" fill="#555555">The client-facing side, under your brand</text>
  <line x1="550" y1="130" x2="890" y2="130" stroke="#E0E0E0" stroke-width="1"/>

  <text x="550" y="158" font-size="13.5" fill="#333333">Their dashboard: products they bought from you</text>
  <text x="550" y="184" font-size="13.5" fill="#333333">Inbox: conversations, web chat, SMS</text>
  <text x="550" y="210" font-size="13.5" fill="#333333">Their CRM, forms, and campaigns</text>
  <text x="550" y="236" font-size="13.5" fill="#333333">Executive Report: proof of performance</text>
  <text x="550" y="262" font-size="13.5" fill="#333333">Vibe: apps built on their business data</text>

  <rect x="540" y="284" width="360" height="84" rx="8" fill="#e9f1fa" stroke="#1976D2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="720" y="309" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1976D2">Your CLIENT'S AI employees work here</text>
  <text x="720" y="331" text-anchor="middle" font-size="12.5" fill="#555555">Their receptionist and voice line, their</text>
  <text x="720" y="349" text-anchor="middle" font-size="12.5" fill="#555555">reputation specialist and their knowledge</text>

</svg>
